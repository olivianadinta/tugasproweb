<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .kalkulator {
            width: 520px;
            border: 1px solid black;
            padding: 10px;
        }

        .baris {
            margin-bottom: 8px;
        }

        label {
            display: inline-block;
            width: 200px;
            font-size: 18px;
        }

        input {
            width: 300px;
            height: 25px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .tombol {
            margin-left: 200px;
            margin-bottom: 8px;
        }

        button {
            width: 42px;
            height: 38px;
            margin-right: 5px;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <h1>Kalkulator Sederhana</h1>
    
    <div class="kalkulator">

        <div class="baris">
            <label>Input Bilangan 1</label>
            <input type="number" id="bilangan1">
        </div>

        <div class="baris">
            <label>Input Bilangan 2</label>
            <input type="number" id="bilangan2">
        </div>

        <div class="tombol">
            <button onclick="hitung('+')">+</button>
            <button onclick="hitung('-')">-</button>
            <button onclick="hitung('*')">x</button>
            <button onclick="hitung('/')">/</button>
        </div>

        <div class="baris">
            <label>Output</label>
            <input type="text" id="output" readonly>
        </div>

    </div>


    <script>

        function hitung(operator) {

            let bilangan1 = Number(
                document.getElementById("bilangan1").value
            );

            let bilangan2 = Number(
                document.getElementById("bilangan2").value
            );

            let hasil;

            if (operator == '+') {
                hasil = bilangan1 + bilangan2;
            }
            else if (operator == '-') {
                hasil = bilangan1 - bilangan2;
            }
            else if (operator == '*') {
                hasil = bilangan1 * bilangan2;
            }
            else if (operator == '/') {
                hasil = bilangan1 / bilangan2;
            }

            document.getElementById("output").value = hasil;
        }

    </script>

</body>
</html>
